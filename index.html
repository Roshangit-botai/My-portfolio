<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L. Roshan Singha · Senior AI Engineer</title>
  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Devicon for original tech logos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <style>
    /* ---------- GLOBAL RESET & GALAXY BACKGROUND ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', 'Poppins', system-ui, sans-serif;
    }

    body {
      background: #050510;
      color: #e6e9ff;
      overflow-x: hidden;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Galaxy Canvas fixed background */
    #galaxy-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 3D floating particles layer */
    #particles-3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #7aaaff);
      box-shadow: 0 0 20px #4f7fff, 0 0 40px #2f4faf;
      opacity: 0.6;
      animation: float3d linear infinite;
    }

    @keyframes float3d {
      0% {
        transform: translate3d(0, 0, 0) scale(0.8);
        opacity: 0;
      }
      10% { opacity: 0.8; }
      50% { opacity: 0.6; }
      90% { opacity: 0.4; }
      100% {
        transform: translate3d(var(--tx, 40px), var(--ty, -80px), 0) scale(1.4);
        opacity: 0;
      }
    }

    .main-wrapper {
      position: relative;
      z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 1.8rem 3rem;
      backdrop-filter: blur(2px);
    }

    /* ---------- TYPOGRAPHY ---------- */
    h1, h2, h3 {
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .section-title {
      font-size: 1.75rem;
      margin: 2.2rem 0 1rem;
      position: relative;
      display: inline-block;
      background: linear-gradient(135deg, #c0e5ff, #d4b5ff, #ffb8f0, #b8d4ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 600;
      letter-spacing: -0.02em;
      filter: drop-shadow(0 0 20px rgba(160, 200, 255, 0.5));
      animation: gradientShift 6s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .section-title i {
      margin-right: 10px;
      color: #9ac8ff;
      -webkit-text-fill-color: #9ac8ff;
      font-size: 1.5rem;
      filter: drop-shadow(0 0 12px #4f7fff);
    }

    .glass-card {
      background: rgba(14, 18, 38, 0.55);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(130, 170, 255, 0.2);
      border-radius: 30px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 50px rgba(70, 130, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .glass-card:hover {
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.9), 0 0 70px rgba(110, 170, 255, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* ---------- HERO ---------- */
    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 1.8rem 2.2rem;
      margin-top: 0.3rem;
      border-radius: 38px;
      background: rgba(9, 13, 28, 0.65);
      border: 1px solid rgba(110, 160, 255, 0.3);
      box-shadow: 0 0 80px rgba(60, 110, 255, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(100, 150, 255, 0.06), transparent, rgba(200, 120, 255, 0.06), transparent);
      animation: rotateGlow 12s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateGlow {
      100% { transform: rotate(360deg); }
    }

    .hero-content {
      flex: 1 1 380px;
      position: relative;
      z-index: 2;
    }

    .hero-content .badge {
      display: inline-block;
      background: rgba(110, 160, 255, 0.14);
      padding: 0.3rem 1.1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      border: 1px solid rgba(120, 170, 255, 0.5);
      margin-bottom: 0.7rem;
      color: #c0d8ff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 18px rgba(80, 140, 255, 0.25);
    }

    .hero-content h1 {
      font-size: 2.9rem;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff, #c8dcff, #e0c0ff, #b8d4ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(140, 190, 255, 0.6));
      font-weight: 600;
      letter-spacing: -0.025em;
      animation: gradientShift 6s ease infinite;
    }

    .hero-content .subhead {
      font-size: 1rem;
      color: #b8c4e8;
      margin: 0.6rem 0 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-weight: 400;
    }

    .hero-content .subhead i {
      color: #7aaaff;
      font-size: 0.95rem;
      filter: drop-shadow(0 0 8px #4f7fff);
    }

    .ai-chip {
      background: linear-gradient(145deg, #131a30, #0a0e1e);
      padding: 0.55rem 1.4rem;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(90, 140, 255, 0.7);
      box-shadow: 0 0 30px rgba(70, 130, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      font-weight: 400;
      font-size: 0.85rem;
      margin-top: 0.2rem;
      color: #d0e0ff;
    }

    .ai-chip i {
      color: #9ac8ff;
      font-size: 1.2rem;
      filter: drop-shadow(0 0 10px #4f7fff);
    }

    /* Profile picture with animated glow */
    .hero-image {
      flex: 0 0 200px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .profile-pic-frame {
      width: 175px;
      height: 175px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #6a8aff, #c084fc, #f0a6ff, #7aaaff, #6a8aff);
      padding: 5px;
      box-shadow: 0 0 70px #3f6fff, 0 0 110px rgba(160, 100, 255, 0.4), inset 0 0 40px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      animation: rotateGlow 8s linear infinite;
    }

    .profile-pic-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0e1222 url('https://images.pexels.com/photos/2379004/pexels-photo-2379004.jpeg?auto=compress&cs=tinysrgb&w=400&h=400&fit=crop') center/cover no-repeat;
      background-size: cover;
      background-position: center 20%;
      border: 3px solid #e8f0ff;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
      animation: rotateGlowReverse 8s linear infinite;
    }

    @keyframes rotateGlowReverse {
      100% { transform: rotate(-360deg); }
    }

    /* ---------- STATS ---------- */
    .stats-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      gap: 0.7rem;
      margin: 1.5rem 0 0.8rem;
      padding: 0.9rem 1.4rem;
      border-radius: 50px;
      background: rgba(10, 16, 34, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(80, 130, 255, 0.45);
      box-shadow: 0 0 40px rgba(60, 120, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      font-size: 0.85rem;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-item i {
      font-size: 1.4rem;
      color: #7aaaff;
      filter: drop-shadow(0 0 12px #4f7fff);
    }

    .stat-item span {
      font-weight: 500;
      color: #d0e0ff;
      font-size: 0.8rem;
    }

    /* ---------- SKILLS (real logos) ---------- */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 0.9rem;
      margin-top: 0.7rem;
    }

    .skill-item {
      background: rgba(18, 24, 46, 0.7);
      backdrop-filter: blur(10px);
      padding: 0.9rem 0.3rem 0.7rem;
      border-radius: 22px;
      text-align: center;
      border: 1px solid rgba(70, 110, 200, 0.4);
      transition: all 0.25s;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      position: relative;
      overflow: hidden;
    }

    .skill-item::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 22px;
      background: radial-gradient(circle at 50% 0%, rgba(120, 170, 255, 0.15), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .skill-item:hover::after {
      opacity: 1;
    }

    .skill-item:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: #7aaaff;
      box-shadow: 0 0 35px #3f6fff, inset 0 1px 0 rgba(255, 255, 255, 0.1);
      background: rgba(25, 35, 65, 0.85);
    }

    .skill-item i {
      font-size: 2.2rem;
      margin-bottom: 4px;
      filter: drop-shadow(0 0 10px rgba(80, 140, 255, 0.6));
      transition: transform 0.25s;
      display: inline-block;
    }

    .skill-item:hover i {
      transform: scale(1.12);
    }

    /* Devicon brand colors */
    .devicon-python-plain { color: #3776AB; }
    .devicon-javascript-plain { color: #F7DF1E; }
    .devicon-react-original { color: #61DAFB; }
    .devicon-nodejs-plain { color: #68A063; }
    .devicon-typescript-plain { color: #3178C6; }
    .devicon-docker-plain { color: #2496ED; }
    .devicon-kubernetes-plain { color: #326CE5; }
    .devicon-amazonwebservices-original { color: #FF9900; }
    .devicon-azure-plain { color: #0078D4; }
    .devicon-mysql-plain { color: #4479A1; }
    .devicon-mongodb-plain { color: #47A248; }
    .devicon-tensorflow-original { color: #FF6F00; }
    .devicon-pytorch-original { color: #EE4C2C; }

    .skill-item .custom-icon {
      font-size: 2rem;
      margin-bottom: 4px;
      color: #8ab4ff;
      display: inline-block;
      filter: drop-shadow(0 0 10px #4f7fff);
    }

    .skill-item span {
      display: block;
      font-weight: 500;
      font-size: 0.7rem;
      color: #ccd9ff;
      letter-spacing: 0.03em;
    }

    /* ---------- EDUCATION ---------- */
    .edu-timeline {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin: 0.8rem 0;
    }

    .edu-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(13, 19, 38, 0.7);
      backdrop-filter: blur(10px);
      padding: 0.85rem 1.4rem;
      border-radius: 34px;
      border: 1px solid rgba(60, 100, 190, 0.4);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: all 0.25s;
    }

    .edu-item:hover {
      border-color: #8ab4ff;
      box-shadow: 0 0 35px rgba(60, 120, 255, 0.4);
      background: rgba(20, 30, 58, 0.85);
      transform: translateX(6px);
    }

    .edu-icon {
      font-size: 1.5rem;
      min-width: 42px;
      text-align: center;
      color: #aac8ff;
      filter: drop-shadow(0 0 8px #4f7fff);
    }

    .edu-detail h3 {
      font-size: 0.95rem;
      color: #e0eaff;
      margin-bottom: 0.1rem;
      font-weight: 600;
    }

    .edu-detail p {
      color: #9aabdd;
      font-size: 0.72rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      letter-spacing: 0.02em;
    }

    .edu-detail p i {
      margin-right: 3px;
      color: #6f8fdf;
      font-size: 0.68rem;
    }

    /* ---------- PROJECTS ---------- */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.3rem;
      margin: 1.2rem 0;
    }

    .project-card {
      background: rgba(13, 19, 40, 0.78);
      backdrop-filter: blur(14px);
      border-radius: 26px;
      padding: 0;
      border: 1px solid rgba(60, 100, 190, 0.45);
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .project-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 26px;
      padding: 1px;
      background: linear-gradient(135deg, transparent, rgba(120, 170, 255, 0.3), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .project-card:hover::before {
      opacity: 1;
    }

    .project-card:hover {
      transform: translateY(-10px) scale(1.01);
      border-color: #7aaaff;
      box-shadow: 0 0 55px #3f6fff, 0 25px 40px black;
    }

    /* Project image areas with 3D feel */
    .project-img {
      height: 105px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 30px #000, 0 0 60px #4f7fff;
      border-bottom: 1px solid rgba(80, 130, 255, 0.3);
      overflow: hidden;
      transition: transform 0.4s;
    }

    .project-card:hover .project-img {
      transform: scale(1.06);
    }

    .project-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 120%, rgba(100, 150, 255, 0.25), transparent 70%);
      pointer-events: none;
    }

      background: linear-gradient(135deg, #0b1a2e, #1c3b5e), url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48Y2lyY2xlIGN4PSI0MCIgY3k9IjQwIiByPSIzNSIgZmlsbD0iIzFhMjgzZiIvPjxjaXJjbGUgY3g9IjQwIiBjeT0iNDAiIHI9IjE4IiBmaWxsPSIjZmZmZmZmIi8+PGNpcmNsZSBjeD0iNDAiIGN5PSI0MCIgcj0iMTAiIGZpbGw9IiMwMDAwMzAiLz48Y2lyY2xlIGN4PSI0MCIgY3k9IjQwIiByPSI1IiBmaWxsPSIjZmZmZmZmIi8+PC9zdmc+') center/cover no-repeat;
      background-blend-mode: overlay;
    }

    .project-img.chart {
      background: linear-gradient(135deg, #0f1f2e, #1f3b4e), url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48cG9seWxpbmUgcG9pbnRzPSIxMCw1MCAyMCw0MCAzMCw1MCA0MCwyMCA1MCw0MCA2MCwzMCA3MCw0NSIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utd2lkdGg9IjQiIGZpbGw9Im5vbmUiLz48L3N2Zz4=') center/cover no-repeat;
      background-blend-mode: overlay;
    }

    .project-img.robot {
      background: linear-gradient(135deg, #1a1f35, #2a3f5e), url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48cmVjdCB4PSIyNSIgeT0iMjAiIHdpZHRoPSIzMCIgaGVpZ2h0PSIzMCIgZmlsbD0iI2ZmZmZmZiIgb3BhY2l0eT0iMC4yIi8+PGNpcmNsZSBjeD0iMzAiIGN5PSIzMCIgcj0iNSIgZmlsbD0iI2ZmZmZmZiIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iMzAiIHI9IjUiIGZpbGw9IiNmZmZmZmYiLz48cG9seWxpbmUgcG9pbnRzPSIzNSw1MCA0MCw1NSA0NSw1MCIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utd2lkdGg9IjMiIGZpbGw9Im5vbmUiLz48L3N2Zz4=') center/cover no-repeat;
      background-blend-mode: overlay;
    }

    .project-img.dna {
      background: linear-gradient(135deg, #1f2a4a, #2f4a7a), url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48cGF0aCBkPSJNMzAgMjAgTDMwIDYwIE01MCAyMCBMNTAgNjAiIHN0cm9rZT0iI2ZmZmZmZiIgc3Ryb2tlLXdpZHRoPSI0IiBzdHJva2UtZGFzaGFycmF5PSI2LDYiLz48Y2lyY2xlIGN4PSIzMCIgY3k9IjQwIiByPSI2IiBmaWxsPSIjZmZmZmZmIi8+PGNpcmNsZSBjeD0iNTAiIGN5PSI0MCIgcj0iNiIgZmlsbD0iI2ZmZmZmZiIvPjwvc3ZnPg==') center/cover no-repeat;
      background-blend-mode: overlay;
    }

    .project-content {
      padding: 0.9rem 1.1rem 1.1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .project-content h3 {
      font-size: 1.1rem;
      color: #dfeaff;
      margin-bottom: 0.2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .project-content p {
      color: #b0bee0;
      font-size: 0.74rem;
      margin-bottom: 0.9rem;
      flex: 1;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }

    .project-links {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .project-links a {
      color: #aac8ff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.68rem;
      padding: 0.28rem 0.9rem;
      border-radius: 40px;
      border: 1px solid rgba(90, 140, 255, 0.7);
      background: rgba(40, 70, 140, 0.25);
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.02em;
      backdrop-filter: blur(4px);
    }

    .project-links a:hover {
      background: linear-gradient(135deg, #3f6fff, #7a5fff);
      color: white;
      box-shadow: 0 0 25px #4f7fff, 0 0 50px rgba(120, 100, 255, 0.4);
      transform: translateY(-2px);
      border-color: transparent;
    }

    /* ---------- CONTACT (real brand logos) ---------- */
    .contact-section {
      margin: 2.2rem 0 1.2rem;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
      gap: 1rem;
      justify-items: center;
      padding: 1.3rem 0.8rem;
      border-radius: 44px;
      background: rgba(8, 12, 24, 0.65);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(70, 110, 210, 0.45);
      box-shadow: 0 0 50px rgba(60, 120, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .contact-icon-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      border-radius: 26px;
      background: rgba(18, 26, 54, 0.75);
      border: 1px solid rgba(70, 110, 210, 0.5);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      text-decoration: none;
      color: #d0e0ff;
      box-shadow: 0 0 22px rgba(60, 120, 255, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .contact-icon-box::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(120, 170, 255, 0.2), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .contact-icon-box:hover::after {
      opacity: 1;
    }

    .contact-icon-box:hover {
      transform: scale(1.12) translateY(-4px);
      border-color: #aac8ff;
      box-shadow: 0 0 45px #3f6fff, 0 15px 30px rgba(0, 0, 0, 0.6);
      background: rgba(30, 45, 85, 0.9);
